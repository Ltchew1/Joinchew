<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissions Queue | CHEW Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/chew-logo-monument.png" alt="CHEW" width="40" height="40">
    </a>
    <span style="color:var(--text-faint); font-size:0.85rem;">Admissions Queue (internal)</span>
  </div>
</header>

<main>
  <section class="section" style="padding-top:48px;">
    <div class="container">
      <h1 style="font-size:1.6rem;">Admissions Queue</h1>

      <div id="access-form" style="display:none; max-width:380px; margin-top:24px;">
        <p style="font-size:0.9rem; color:var(--text-muted);">Sign in with the CHEW admin account to open the queue.</p>
        <div id="access-error" class="status-note" style="display:none; margin-bottom:12px;"></div>
        <button type="button" class="btn btn-gold" id="admin-sign-in">Sign In</button>
      </div>

      <div id="queue-status" class="status-note" style="margin-top:16px;"></div>
      <div id="pipeline-filters" style="margin-top:20px; display:flex; flex-wrap:wrap; gap:6px;"></div>
      <div id="queue-list" style="margin-top:24px; display:flex; flex-direction:column; gap:20px;"></div>
    </div>
  </section>
</main>

<style>
  .app-card { padding: 24px; scroll-margin-top: 24px; }
  .app-card.is-highlighted { border-color: var(--gold-light); box-shadow: 0 0 0 1px rgba(232,206,122,0.3); }
  .app-top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .app-meta { font-size: 0.85rem; color: var(--text-faint); }
  .app-badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.72rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; }
  .app-badge--new { background: rgba(122,163,232,0.15); color: #9db8e8; }
  .app-badge--review { background: rgba(201,162,39,0.15); color: var(--gold-light); }
  .app-badge--decided { background: rgba(255,255,255,0.08); color: var(--text-muted); }
  .app-badge--stage { background: rgba(95,163,122,0.15); color: #7fd9a4; }
  .app-badge--pipeline { background: rgba(122,163,232,0.15); color: #9db8e8; }

  .app-summary { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:10px 20px; margin:16px 0; padding:16px; background: rgba(0,0,0,0.15); border-radius: 8px; }
  .app-summary dt { font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold-light); margin-bottom:3px; }
  .app-summary dd { margin:0; font-size:0.92rem; color: var(--text); }

  .app-section-toggle { cursor:pointer; color: var(--gold-light); font-size:0.85rem; margin-top:12px; display:inline-block; }
  .app-answers-block { display:none; margin-top:10px; }
  .app-answers-block dl { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:8px 20px; margin:0; padding:14px; background: rgba(0,0,0,0.2); border-radius:8px; }
  .app-answers-block dt { font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; color: var(--text-faint); margin-bottom:2px; }
  .app-answers-block dd { margin:0 0 6px; font-size:0.85rem; }

  .app-analysis-block { display:none; margin-top:10px; padding:14px; background: rgba(201,162,39,0.05); border:1px solid rgba(201,162,39,0.18); border-radius:8px; }
  .app-analysis-caveat { font-size:0.72rem; color: var(--gold-light); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px; display:block; }
  .app-score { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.8rem; font-weight:700; margin-right:8px; }
  .app-score.high { background: rgba(74,181,120,0.15); color: #7fd9a4; }
  .app-score.mid { background: rgba(201,162,39,0.15); color: var(--gold-light); }
  .app-score.low { background: rgba(196,74,74,0.15); color: #e08a8a; }

  .decision-fields { margin-top:18px; display:flex; flex-direction:column; gap:14px; }
  .decision-field label { display:block; font-size:0.82rem; font-weight:600; margin-bottom:6px; }
  .decision-field .field-hint { font-weight:400; color: var(--text-faint); }
  .decision-field textarea { width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.03); color:var(--text); font-size:0.9rem; font-family:inherit; }
  .decision-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .decision-row button { font-size:0.8rem; padding:8px 14px; }
  .decided-badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.78rem; background: rgba(255,255,255,0.08); }

  .confirm-panel { margin-top:14px; padding:16px; border:1px solid var(--gold-light); border-radius:8px; background: rgba(201,162,39,0.06); display:none; }
  .confirm-panel.is-visible { display:block; }
  .confirm-panel p { margin:0 0 12px; font-size:0.9rem; }
  .confirm-actions { display:flex; gap:10px; }

  .scope-toggle { cursor:pointer; color: var(--gold-light); font-size:0.85rem; margin-top:12px; display:inline-block; }
  .scope-panel { display:none; margin-top:14px; padding:18px; border:1px solid rgba(201,162,39,0.25); border-radius:10px; background: rgba(201,162,39,0.04); }
  .scope-panel.is-open { display:block; }
  .scope-field { margin-bottom:16px; }
  .scope-field label { display:block; font-size:0.82rem; font-weight:600; margin-bottom:6px; }
  .scope-field .field-hint { font-weight:400; color: var(--text-faint); }
  .scope-field select, .scope-field textarea {
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.03); color:var(--text); font-size:0.88rem; font-family:inherit;
  }
  .scope-field select { -webkit-appearance:none; appearance:none; }
  .scope-focus-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:8px; }
  .scope-focus-grid label { display:flex; align-items:center; gap:8px; font-size:0.85rem; font-weight:400; cursor:pointer; }
  .scope-condition-row { display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; }
  .scope-condition-row input[type="text"] {
    flex:1; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.03); color:var(--text); font-size:0.85rem; font-family:inherit;
  }
  .scope-condition-row label { display:flex; align-items:center; gap:5px; font-size:0.78rem; white-space:nowrap; color:var(--text-faint); }
  .scope-condition-remove { background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:1.1rem; line-height:1; padding:4px 8px; }
  .scope-actions { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .scope-existing-badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:700; text-transform:uppercase; margin-bottom:12px; }
  .scope-existing-badge.draft { background: rgba(122,163,232,0.15); color: #9db8e8; }
  .scope-existing-badge.sent { background: rgba(74,181,120,0.15); color: #7fd9a4; }
  .scope-focus-pill {
    display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
    background: rgba(201,162,39,0.12); border: 1px solid rgba(201,162,39,0.3); color: var(--gold-light); margin: 0 6px 6px 0;
  }

  .delivery-toggle { cursor:pointer; color: var(--gold-light); font-size:0.85rem; margin-top:12px; display:inline-block; }
  .delivery-panel { display:none; margin-top:14px; padding:18px; border:1px solid rgba(201,162,39,0.25); border-radius:10px; background: rgba(201,162,39,0.04); }
  .delivery-panel.is-open { display:block; }
  .delivery-log-row { display:flex; gap:8px; align-items:center; margin:8px 0 4px; }
  .delivery-log-row input[type="number"] {
    width:90px; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.03); color:var(--text); font-size:0.85rem; font-family:inherit;
  }
  .app-badge--graduate { background: rgba(74,181,120,0.15); color: #7fd9a4; }
  .app-badge--portal { background: rgba(122,163,232,0.15); color: #9db8e8; }

  .pipeline-filter-chip {
    padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid rgba(255,255,255,0.15); background: none; color: var(--text-muted); cursor: pointer;
  }
  .pipeline-filter-chip:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .pipeline-filter-chip.is-active { background: rgba(201,162,39,0.15); border-color: var(--gold-light); color: var(--gold-light); }
</style>

<script>
(function () {
  // Real admin authentication via Clerk (see lib/admin-auth.js for the
  // server-side half). No secret of any kind ever appears in this page's
  // source, in a URL, or in browser storage — the operator signs in
  // through Clerk's own hosted UI, and every fetch below attaches a
  // fresh, short-lived Clerk session token as a Bearer header. This page
  // renders NO application data until Clerk confirms a session AND the
  // server independently authorizes it — the fetch succeeding is what
  // reveals the queue, not the client-side "signed in" flag alone.
  var CLERK_JS_VERSION = '6.31.0';
  var statusEl = document.getElementById('queue-status');
  var listEl = document.getElementById('queue-list');
  var filterEl = document.getElementById('pipeline-filters');
  var activePipelineFilter = 'ALL';
  var accessForm = document.getElementById('access-form');
  var accessError = document.getElementById('access-error');
  var signInBtn = document.getElementById('admin-sign-in');

  function showAccessForm(message) {
    accessForm.style.display = 'block';
    listEl.innerHTML = '';
    statusEl.style.display = 'none';
    if (message) {
      accessError.textContent = message;
      accessError.classList.add('visible');
      accessError.style.display = 'block';
    } else {
      accessError.style.display = 'none';
    }
  }

  function loadClerkScript(publishableKey) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.setAttribute('data-clerk-publishable-key', publishableKey);
      script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@' + CLERK_JS_VERSION + '/dist/clerk.browser.js';
      script.addEventListener('load', function () {
        window.Clerk.load().then(resolve).catch(reject);
      });
      script.addEventListener('error', function () { reject(new Error('Failed to load the sign-in system.')); });
      document.head.appendChild(script);
    });
  }

  // Always asks Clerk for a token fresh (never cached across calls) —
  // Clerk transparently returns the current valid token or refreshes it,
  // so every fetch below carries a token that's actually still good.
  function getAuthToken() {
    if (!window.Clerk || !window.Clerk.session) return Promise.resolve(null);
    return window.Clerk.session.getToken().catch(function () { return null; });
  }

  signInBtn.addEventListener('click', function () {
    signInBtn.disabled = true;
    window.Clerk.openSignIn({
      afterSignInUrl: window.location.href,
      afterSignUpUrl: window.location.href,
    });
  });

  window.addEventListener('DOMContentLoaded', function () {
    fetch('/api/admin-auth-config')
      .then(function (res) {
        if (!res.ok) throw new Error('Admin sign-in is not configured yet.');
        return res.json();
      })
      .then(function (config) { return loadClerkScript(config.publishableKey); })
      .then(function () {
        window.Clerk.addListener(function (resources) {
          if (resources.user) {
            accessForm.style.display = 'none';
            loadQueue();
          } else {
            showAccessForm();
          }
        });
        if (window.Clerk.user) {
          loadQueue();
        } else {
          showAccessForm();
        }
      })
      .catch(function (err) {
        showAccessForm(err.message);
        signInBtn.style.display = 'none';
      });
  });

  var DECISIONS = [
    { value: 'ACCEPT', label: 'Accept' },
    { value: 'ACCEPT_WITH_CONDITIONS', label: 'Accept w/ Conditions' },
    { value: 'WAITLIST', label: 'Waitlist' },
    { value: 'REFER_ELSEWHERE', label: 'Refer Elsewhere' },
    { value: 'REAPPLY_LATER', label: 'Reapply Later' },
  ];

  // Same 4 one-time tiers lib/programs.js's ONE_TIME_TIERS defines —
  // Membership is deliberately never offered here (locked doctrine:
  // graduates-only, never a first-time recommendation).
  var SCOPE_TIERS = [
    { value: 'focused_builder', label: 'Focused Builder' },
    { value: 'infrastructure', label: 'Infrastructure' },
    { value: 'advanced_infrastructure', label: 'Advanced Infrastructure' },
    { value: 'executive', label: 'Executive Advisory' },
  ];
  // Same locked 9-slug taxonomy as lib/focusAreas.js.
  var SCOPE_FOCUS_AREAS = [
    ['financial_organization', 'FINANCIAL ORGANIZATION'], ['credit_intelligence', 'CREDIT INTELLIGENCE'],
    ['cash_flow_banking', 'CASH FLOW & BANKING'], ['business_foundation', 'BUSINESS FOUNDATION'],
    ['funding_readiness', 'FUNDING READINESS'], ['income_opportunity', 'INCOME & OPPORTUNITY'],
    ['property_readiness', 'PROPERTY READINESS'], ['protection_risk', 'PROTECTION & RISK'],
    ['decision_sequencing', 'DECISION SEQUENCING'],
  ];

  // Same label vocabulary as apply.html / lib/email.js, so the queue shows
  // the words the applicant actually tapped, not raw machine values.
  var ANSWER_LABELS = {
    primary_move: { money_organized: 'Get My Money Organized', credit_position: 'Strengthen My Credit Position', business_growth: 'Build/Grow My Business', funding_ready: 'Get Funding-Ready', prepare_home: 'Prepare for a Home', build_property: 'Build Toward Property', income_career: 'Increase Income/Career', protect_building: 'Protect What I’m Building', not_sure: 'Not Sure Yet' },
    income_type: { w2: 'W-2 / Job', business_self_employed: 'Business/Self-Employed', both: 'Both', fixed_benefit: 'Fixed/Benefit Income', inconsistent: 'Income Is Inconsistent', prefer_not_to_say: 'Prefer Not to Say' },
    income_range: { under_25k: 'Under $25K', '25k_50k': '$25K–$50K', '50k_75k': '$50K–$75K', '75k_100k': '$75K–$100K', '100k_150k': '$100K–$150K', '150k_250k': '$150K–$250K', '250k_plus': '$250K+' },
    savings_range: { under_1k: 'Under $1K', '1k_5k': '$1K–$5K', '5k_15k': '$5K–$15K', '15k_50k': '$15K–$50K', '50k_100k': '$50K–$100K', '100k_plus': '$100K+', prefer_not_to_say: 'Prefer Not to Say' },
    debt_range: { none: 'None', under_5k: 'Under $5K', '5k_15k': '$5K–$15K', '15k_50k': '$15K–$50K', '50k_100k': '$50K–$100K', '100k_plus': '$100K+', not_sure: 'Not Sure' },
    business_status: { no: 'No', idea_stage: 'Idea Stage', formed_no_revenue: 'Formed, No Revenue Yet', under_50k_year: 'Operating Under $50K/yr', '50k_250k_year': '$50K–$250K/yr', '250k_plus_year': '$250K+/yr' },
    credit_monitoring: { yes_regularly: 'Yes — Regularly', sometimes: 'Sometimes', no: 'No', not_sure_what_to_use: 'Not Sure What to Use' },
    primary_barrier: { cash_flow: 'Cash Flow', debt: 'Debt', credit_position: 'Credit Position', savings_reserves: 'Savings/Reserves', income: 'Income', business_structure: 'Business Structure', documentation: 'Documentation', funding_readiness: 'Funding Readiness', dont_know: 'Not Sure Yet' },
    organization_level: { real_system: 'I Have a Real System', mostly_organized: 'Mostly Organized', some_organized: 'Some Things Are Organized', pretty_scattered: 'Pretty Scattered', need_system_from_scratch: 'I Need a System From Scratch' },
    timeline: { now: 'Now', within_30_days: 'Within 30 Days', '1_3_months': '1–3 Months', '3_6_months': '3–6 Months', '6_12_months': '6–12 Months', just_exploring: 'Just Exploring' },
    help_type: { understand_position: 'Help Me Understand My Position', clear_strategy: 'Give Me a Clear Strategy', organize_pieces: 'Help Me Organize the Pieces', what_to_do_next: 'Show Me What to Do Next', ongoing_guidance: 'Ongoing Guidance/Accountability', not_sure: 'Not Sure Yet' },
  };
  var SUMMARY_FIELDS = [
    ['primary_move', 'Primary Move'], ['income_range', 'Income'], ['primary_barrier', 'Primary Barrier'],
    ['timeline', 'Timeline'], ['business_status', 'Business'], ['credit_monitoring', 'Credit Monitoring'],
  ];
  var ALL_FIELDS = [
    ['primary_move', 'Primary Move'], ['income_type', 'Income Type'], ['income_range', 'Income Range'],
    ['savings_range', 'Savings Range'], ['debt_range', 'Debt Range'], ['business_status', 'Business Status'],
    ['credit_monitoring', 'Credit Monitoring'], ['primary_barrier', 'Primary Barrier'],
    ['organization_level', 'Organization Level'], ['timeline', 'Timeline'], ['help_type', 'Help Type'],
  ];
  function answerLabel(key, value) {
    return (ANSWER_LABELS[key] && ANSWER_LABELS[key][value]) || value || '—';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; });
  }

  function scoreClass(score) {
    if (score === null || score === undefined) return 'mid';
    if (score >= 75) return 'high';
    if (score >= 40) return 'mid';
    return 'low';
  }

  // NEW / UNDER REVIEW / DECIDED — from applications.status, which the
  // submit + scoring pipeline already sets ('submitted' -> 'scored'
  // automatically right after AI scoring runs -> 'decided' once an admin
  // sends a decision). No new column needed for this part.
  function reviewBadge(app) {
    if (app.status === 'decided') return '<span class="app-badge app-badge--decided">Decided</span>';
    if (app.status === 'scored') return '<span class="app-badge app-badge--review">Under Review</span>';
    return '<span class="app-badge app-badge--new">New</span>';
  }

  // Journey stage — derived read-only from three real signals written by
  // other endpoints in this flow (see api/admin-applications.js): the
  // application's own status/decision, the most recent agreement
  // signature, and the most recent program purchase. "Program Selected"
  // and "Deal Sheet Reviewed" are NOT separately shown here: the current
  // architecture has no persisted event for either (select-program.html
  // doesn't write anything; the deal sheet is a client-side reveal that's
  // never POSTed) — the first real signal after a decision is the
  // agreement signature itself, so that's reported honestly as
  // "Agreement Signed" rather than implying stages that aren't tracked.
  function journeyStage(app) {
    // initial_payment_paid_at/paid_in_full_at cover the recommendation-
    // engine's payment-plan purchases; entry_paid_at remains for purchases
    // made under the older entry+remainder model — a row is only ever
    // populated under the model that actually created it, so checking
    // both is additive, not a guess.
    if (app.purchase_status === 'complete' || app.membership_status === 'active' || app.membership_status === 'trialing' || app.paid_in_full_at) return 'Paid';
    if (app.entry_paid_at || app.initial_payment_paid_at) return 'Payment Completed';
    if (app.agreement_signed_at) return 'Agreement Signed';
    if (app.decision === 'ACCEPT' || app.decision === 'ACCEPT_WITH_CONDITIONS') return 'Accepted';
    if (app.status === 'decided') return 'Decision Sent';
    if (app.status === 'scored') return 'Under Review';
    return 'Starting Position Submitted';
  }

  // The CHEW Recommendation Engine's own sub-pipeline, shown as a second
  // badge alongside journeyStage() above — only meaningful for accepted
  // applications that haven't reached a signed agreement yet (once
  // signed, journeyStage()'s own states take over; nothing here is
  // re-derived once real payment/agreement facts exist, so this never
  // contradicts them). Every state below is read directly off a
  // persisted timestamp/column — never inferred or guessed (directive:
  // "Do not fake a state without persisted evidence").
  function recommendationPipelineStage(app) {
    if (!(app.decision === 'ACCEPT' || app.decision === 'ACCEPT_WITH_CONDITIONS')) return null;
    if (app.agreement_signed_at) return null;
    if (!app.recommendation_status) return 'SCOPE NEEDED';
    if (app.recommendation_status === 'draft') return 'RECOMMENDATION DRAFT';
    if (app.recommendation_status === 'superseded' || app.recommendation_status === 'withdrawn') return 'SCOPE NEEDED';
    // status === 'sent' from here down
    if (app.recommendation_scope_review_requested_at) return 'SCOPE REVIEW REQUESTED';
    if (app.selected_payment_plan) return 'AWAITING SIGNATURE';
    if (app.selected_tier) return 'ENGAGEMENT SELECTED';
    if (app.recommendation_viewed_at) return 'RECOMMENDATION VIEWED';
    return 'RECOMMENDATION SENT';
  }

  var PIPELINE_FILTERS = [
    'ALL', 'NEEDS REVIEW', 'SCOPE NEEDED', 'RECOMMENDATION DRAFT', 'RECOMMENDATION SENT',
    'RECOMMENDATION VIEWED', 'SCOPE REVIEW REQUESTED', 'ENGAGEMENT SELECTED', 'AWAITING SIGNATURE',
    'AGREEMENT SIGNED', 'AWAITING PAYMENT', 'PAID',
  ];
  // A single overall pipeline label per application, used only for
  // filtering (the card itself still shows the more specific badges).
  // "NEEDS REVIEW" covers anything pre-decision (New/Under Review);
  // everything else maps directly to a real persisted signal already
  // computed above.
  function overallPipelineLabel(app) {
    if (app.status !== 'decided') return 'NEEDS REVIEW';
    var recStage = recommendationPipelineStage(app);
    if (recStage) return recStage;
    var stage = journeyStage(app);
    if (stage === 'Agreement Signed') return 'AGREEMENT SIGNED';
    if (stage === 'Payment Completed') return 'AWAITING PAYMENT';
    if (stage === 'Paid') return 'PAID';
    return null; // decided but not ACCEPT/ACCEPT_WITH_CONDITIONS (waitlisted etc.) -- no pipeline filter applies
  }

  // Same per-tier session/document-review ceilings as lib/programs.js
  // PROGRAMS[tier].sessionCount / .documentReviewEvents (one-time tiers
  // only — Membership has no session/review ceiling to log against, see
  // api/log-session-delivered.js).
  var TIER_DELIVERY_LIMITS = {
    focused_builder: { sessionCount: 2, documentReviewEvents: 1 },
    infrastructure: { sessionCount: 4, documentReviewEvents: 2 },
    advanced_infrastructure: { sessionCount: 6, documentReviewEvents: 4 },
    executive: { sessionCount: 8, documentReviewEvents: 6 },
  };

  function scopeTierLabel(v) {
    var m = SCOPE_TIERS.filter(function (t) { return t.value === v; })[0];
    return m ? m.label : v;
  }

  function buildScopeToggleHtml(app) {
    return '<span class="scope-toggle" data-app="' + app.id + '">CHEW Recommendation (Scope Builder) &darr;</span>' +
      '<div class="scope-panel" id="scope-panel-' + app.id + '"></div>';
  }

  // Lazy-loads the applicant's current recommendation state on first
  // expand — GET /api/admin-recommendation, admin-authed. Not fetched for
  // every card on page load; only when an operator actually opens it.
  function wireScopeBuilder(card, app) {
    var toggle = card.querySelector('.scope-toggle');
    var panel = card.querySelector('.scope-panel');
    var loaded = false;

    toggle.addEventListener('click', function () {
      if (panel.classList.contains('is-open')) { panel.classList.remove('is-open'); return; }
      panel.classList.add('is-open');
      if (loaded) return;
      loaded = true;
      panel.innerHTML = '<p style="font-size:0.85rem; color:var(--text-faint);">Loading…</p>';

      getAuthToken().then(function (token) {
        return fetch('/api/admin-recommendation?applicationId=' + encodeURIComponent(app.id), {
          headers: { authorization: 'Bearer ' + (token || '') },
        });
      }).then(function (res) {
        if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || 'Unable to load recommendation.'); });
        return res.json();
      }).then(function (data) {
        if (data.recommendation && !data.editingDraft && data.recommendation.status === 'sent') {
          renderScopeReadOnly(panel, app, data.recommendation, data.conditions);
        } else {
          var formConditions = (data.conditions || []).map(function (c) { return { text: c.condition_text, blocking: c.blocking }; });
          renderScopeForm(panel, app, data.recommendation, formConditions);
        }
      }).catch(function (err) {
        loaded = false;
        panel.innerHTML = '<p style="color:#e08a8a; font-size:0.85rem;">' + esc(err.message || 'Unable to load recommendation.') + '</p>';
      });
    });
  }

  // A currently-SENT recommendation with no in-progress draft: shown as a
  // read-only summary. Condition wording/blocking are never editable here
  // — only satisfied status, via its own independent PATCH call (see file
  // header doctrine: substantive changes require a new version instead).
  function renderScopeReadOnly(panel, app, rec, conditions) {
    var focusHtml = (rec.focus_areas || []).map(function (slug) {
      var m = SCOPE_FOCUS_AREAS.filter(function (f) { return f[0] === slug; })[0];
      return '<span class="scope-focus-pill">' + esc(m ? m[1] : slug) + '</span>';
    }).join('');

    var condHtml = (conditions || []).map(function (c) {
      var badge = c.blocking
        ? '<em style="color:#e08a8a; font-style:normal; font-size:0.72rem;">(BLOCKING)</em>'
        : '<em style="color:var(--text-faint); font-style:normal; font-size:0.72rem;">(optional)</em>';
      return '<div class="scope-condition-row" style="align-items:center;">' +
        '<span style="flex:1; font-size:0.85rem;' + (c.satisfied ? ' text-decoration:line-through; color:var(--text-faint);' : '') + '">' +
          esc(c.condition_text) + ' ' + badge +
        '</span>' +
        '<label><input type="checkbox" class="scope-cond-satisfied" data-condition-id="' + c.id + '"' + (c.satisfied ? ' checked' : '') + '> Satisfied</label>' +
      '</div>';
    }).join('');

    var prioritiesHtml = (rec.recommended_priorities || []).map(function (p) {
      return '<li style="font-size:0.85rem;">' + esc(p) + '</li>';
    }).join('');

    panel.innerHTML =
      '<span class="scope-existing-badge sent">Sent &mdash; v' + rec.version + '</span>' +
      '<p style="font-size:0.9rem;"><strong>Primary:</strong> ' + esc(scopeTierLabel(rec.primary_tier)) + '</p>' +
      (rec.alternative_tier ? '<p style="font-size:0.9rem;"><strong>Alternative:</strong> ' + esc(scopeTierLabel(rec.alternative_tier)) + '</p>' : '') +
      '<p style="font-size:0.9rem;"><strong>Why this fits:</strong> ' + esc(rec.client_facing_reason) + '</p>' +
      (focusHtml ? '<div style="margin:10px 0;">' + focusHtml + '</div>' : '') +
      (prioritiesHtml ? '<div class="scope-field"><label>What Needs to Happen</label><ul style="margin:4px 0 0 18px; padding:0;">' + prioritiesHtml + '</ul></div>' : '') +
      (condHtml ? '<div class="scope-field"><label>Conditions</label>' + condHtml + '</div>' : '') +
      (rec.scope_review_requested_at ? '<p style="font-size:0.85rem; color:var(--gold-light);">Scope review requested ' + new Date(rec.scope_review_requested_at).toLocaleString() + (rec.scope_review_message ? ': “' + esc(rec.scope_review_message) + '”' : '') +
        (rec.scope_review_owner_notified_at ? '' : ' <button type="button" class="btn btn-outline btn-sm scope-resend-review-notice-btn" style="margin-left:6px;">Retry Notification</button>') +
        '</p>' : '') +
      (rec.client_recommendation_notified_at
        ? '<p style="font-size:0.8rem; color:var(--text-faint);">Client notified ' + new Date(rec.client_recommendation_notified_at).toLocaleString() + '</p>'
        : '<p style="font-size:0.8rem; color:#e08a8a;">Notification email not yet delivered. <button type="button" class="btn btn-outline btn-sm scope-resend-notification-btn" style="margin-left:6px;">Retry Notification</button></p>') +
      '<div class="scope-form-status status-note" style="display:none; margin-top:10px;"></div>' +
      '<div class="scope-actions"><button type="button" class="btn btn-outline btn-sm scope-revise-btn">Revise This Recommendation (New Version)</button></div>';

    var resendBtn = panel.querySelector('.scope-resend-notification-btn');
    if (resendBtn) {
      resendBtn.addEventListener('click', function () {
        var statusEl = panel.querySelector('.scope-form-status');
        resendBtn.disabled = true;
        resendBtn.textContent = 'Sending…';
        getAuthToken().then(function (token) {
          return fetch('/api/resend-recommendation-notification', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token || '') },
            body: JSON.stringify({ applicationId: app.id }),
          });
        }).then(function (res) {
          return res.json().then(function (body) { if (!res.ok) throw new Error(body.error || 'Unable to resend.'); return body; });
        }).then(function () {
          renderScopeReadOnly(panel, app, Object.assign({}, rec, { client_recommendation_notified_at: new Date().toISOString() }), conditions);
        }).catch(function (err) {
          resendBtn.disabled = false;
          resendBtn.textContent = 'Retry Notification';
          statusEl.textContent = err.message || 'Something went wrong.';
          statusEl.style.display = 'block';
        });
      });
    }

    var resendReviewBtn = panel.querySelector('.scope-resend-review-notice-btn');
    if (resendReviewBtn) {
      resendReviewBtn.addEventListener('click', function () {
        var statusEl = panel.querySelector('.scope-form-status');
        resendReviewBtn.disabled = true;
        resendReviewBtn.textContent = 'Sending…';
        getAuthToken().then(function (token) {
          return fetch('/api/resend-scope-review-notification', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token || '') },
            body: JSON.stringify({ applicationId: app.id }),
          });
        }).then(function (res) {
          return res.json().then(function (body) { if (!res.ok) throw new Error(body.error || 'Unable to resend.'); return body; });
        }).then(function () {
          renderScopeReadOnly(panel, app, Object.assign({}, rec, { scope_review_owner_notified_at: new Date().toISOString() }), conditions);
        }).catch(function (err) {
          resendReviewBtn.disabled = false;
          resendReviewBtn.textContent = 'Retry Notification';
          statusEl.textContent = err.message || 'Something went wrong.';
          statusEl.style.display = 'block';
        });
      });
    }

    panel.querySelectorAll('.scope-cond-satisfied').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var conditionId = cb.getAttribute('data-condition-id');
        var satisfied = cb.checked;
        var statusEl = panel.querySelector('.scope-form-status');
        cb.disabled = true;
        getAuthToken().then(function (token) {
          return fetch('/api/recommendation-conditions', {
            method: 'PATCH',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token || '') },
            body: JSON.stringify({ conditionId: Number(conditionId), satisfied: satisfied }),
          });
        }).then(function (res) {
          if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || 'Unable to update condition.'); });
          return res.json();
        }).then(function () {
          cb.disabled = false;
          cb.closest('.scope-condition-row').querySelector('span').style.textDecoration = satisfied ? 'line-through' : 'none';
        }).catch(function (err) {
          cb.checked = !satisfied;
          cb.disabled = false;
          statusEl.textContent = err.message || 'Something went wrong.';
          statusEl.style.display = 'block';
        });
      });
    });

    panel.querySelector('.scope-revise-btn').addEventListener('click', function () {
      var formConditions = (conditions || []).map(function (c) { return { text: c.condition_text, blocking: c.blocking }; });
      renderScopeForm(panel, app, rec, formConditions);
    });
  }

  // The editable Scope Builder form — used for a brand-new recommendation,
  // an in-progress draft, or starting a new version from a sent one
  // (via the "Revise" button above). Saving always goes through
  // POST /api/save-recommendation, which enforces version/draft
  // bookkeeping server-side — this form never guesses a version number.
  function renderScopeForm(panel, app, rec, conditionsForForm) {
    var primaryOptions = SCOPE_TIERS.map(function (t) {
      return '<option value="' + t.value + '"' + (rec && rec.primary_tier === t.value ? ' selected' : '') + '>' + t.label + '</option>';
    }).join('');
    var altOptions = '<option value="">None</option>' + SCOPE_TIERS.map(function (t) {
      return '<option value="' + t.value + '"' + (rec && rec.alternative_tier === t.value ? ' selected' : '') + '>' + t.label + '</option>';
    }).join('');
    var focusAreasSelected = (rec && rec.focus_areas) || [];
    var focusHtml = SCOPE_FOCUS_AREAS.map(function (f) {
      var checked = focusAreasSelected.indexOf(f[0]) !== -1 ? ' checked' : '';
      return '<label><input type="checkbox" class="scope-focus-checkbox" value="' + f[0] + '"' + checked + '> ' + f[1] + '</label>';
    }).join('');
    var badgeVersion = rec ? (rec.version || 0) + (rec.status === 'sent' ? 1 : 0) : 1;

    panel.innerHTML =
      '<span class="scope-existing-badge draft">' + (rec && rec.status === 'draft' ? 'Editing Draft &mdash; v' + badgeVersion : 'New Recommendation &mdash; v' + badgeVersion) + '</span>' +
      '<div class="scope-field"><label>Primary Recommended Engagement</label><select class="scope-primary-tier">' + primaryOptions + '</select></div>' +
      '<div class="scope-field"><label>Approved Alternative <span class="field-hint">&mdash; optional, narrower starting point</span></label><select class="scope-alternative-tier">' + altOptions + '</select></div>' +
      '<div class="scope-field" data-role="tradeoff-wrap"' + (rec && rec.alternative_tier ? '' : ' hidden') + '><label>Alternative Tradeoff <span class="field-hint">&mdash; required if an alternative is offered; what\'s NOT included vs. the primary</span></label><textarea class="scope-alternative-tradeoff" rows="2">' + esc(rec ? rec.alternative_tradeoff || '' : '') + '</textarea></div>' +
      '<div class="scope-field"><label>CHEW Focus Areas</label><div class="scope-focus-grid">' + focusHtml + '</div></div>' +
      '<div class="scope-field"><label>What CHEW Sees <span class="field-hint">&mdash; optional, human-authored summary; never raw AI output</span></label><textarea class="scope-summary" rows="2">' + esc(rec ? rec.client_facing_summary || '' : '') + '</textarea></div>' +
      '<div class="scope-field"><label>Why This Fits <span class="field-hint">&mdash; required, this is what the applicant reads</span></label><textarea class="scope-reason" rows="3">' + esc(rec ? rec.client_facing_reason || '' : '') + '</textarea></div>' +
      '<div class="scope-field"><label>What Needs to Happen <span class="field-hint">&mdash; optional, up to 5 short priorities, one per line</span></label><textarea class="scope-priorities" rows="3" placeholder="e.g. Get all three bureaus pulled and reviewed">' + esc(((rec && rec.recommended_priorities) || []).join('\n')) + '</textarea></div>' +
      '<div class="scope-field"><label>Conditions <span class="field-hint">&mdash; optional</span></label><div class="scope-conditions-list"></div><button type="button" class="btn btn-outline btn-sm scope-add-condition">+ Add Condition</button></div>' +
      '<div class="scope-form-status status-note" style="display:none;"></div>' +
      '<div class="scope-actions"><button type="button" class="btn btn-outline scope-save-draft">Save Draft</button><button type="button" class="btn btn-gold scope-approve-send">Approve &amp; Send</button></div>';

    var condList = panel.querySelector('.scope-conditions-list');
    function addConditionRow(text, blocking) {
      var row = document.createElement('div');
      row.className = 'scope-condition-row';
      row.innerHTML =
        '<input type="text" class="cond-text" placeholder="e.g. Provide a completed business formation questionnaire" value="' + esc(text || '') + '">' +
        '<label><input type="checkbox" class="cond-blocking"' + (blocking !== false ? ' checked' : '') + '> Blocking</label>' +
        '<button type="button" class="scope-condition-remove" aria-label="Remove condition">&times;</button>';
      row.querySelector('.scope-condition-remove').addEventListener('click', function () { row.remove(); });
      condList.appendChild(row);
    }
    (conditionsForForm || []).forEach(function (c) { addConditionRow(c.text, c.blocking); });
    panel.querySelector('.scope-add-condition').addEventListener('click', function () { addConditionRow('', true); });

    panel.querySelector('.scope-alternative-tier').addEventListener('change', function () {
      panel.querySelector('[data-role="tradeoff-wrap"]').hidden = !this.value;
    });
    panel.querySelector('.scope-primary-tier').addEventListener('change', function () {
      var altSelect = panel.querySelector('.scope-alternative-tier');
      if (altSelect.value === this.value) {
        altSelect.value = '';
        panel.querySelector('[data-role="tradeoff-wrap"]').hidden = true;
      }
    });

    function collectForm() {
      return {
        primaryTier: panel.querySelector('.scope-primary-tier').value,
        alternativeTier: panel.querySelector('.scope-alternative-tier').value || null,
        focusAreas: Array.prototype.slice.call(panel.querySelectorAll('.scope-focus-checkbox:checked')).map(function (cb) { return cb.value; }),
        clientFacingReason: panel.querySelector('.scope-reason').value.trim(),
        clientFacingSummary: panel.querySelector('.scope-summary').value.trim() || null,
        alternativeTradeoff: panel.querySelector('.scope-alternative-tradeoff').value.trim() || null,
        conditions: Array.prototype.slice.call(panel.querySelectorAll('.scope-condition-row')).map(function (row) {
          return { text: row.querySelector('.cond-text').value.trim(), blocking: row.querySelector('.cond-blocking').checked };
        }).filter(function (c) { return c.text; }),
        recommendedPriorities: panel.querySelector('.scope-priorities').value.split('\n')
          .map(function (line) { return line.trim(); }).filter(Boolean).slice(0, 5),
      };
    }

    function submitScope(action, btn) {
      var statusEl = panel.querySelector('.scope-form-status');
      var data = collectForm();
      statusEl.style.display = 'none';
      btn.disabled = true;
      var originalText = btn.textContent;
      btn.textContent = action === 'send' ? 'Sending…' : 'Saving…';

      getAuthToken().then(function (token) {
        return fetch('/api/save-recommendation', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token || '') },
          body: JSON.stringify({
            applicationId: app.id, action: action, primaryTier: data.primaryTier, alternativeTier: data.alternativeTier,
            focusAreas: data.focusAreas, clientFacingReason: data.clientFacingReason,
            clientFacingSummary: data.clientFacingSummary, alternativeTradeoff: data.alternativeTradeoff,
            conditions: data.conditions, recommendedPriorities: data.recommendedPriorities,
          }),
        });
      }).then(function (res) {
        return res.json().then(function (body) { if (!res.ok) throw new Error(body.error || 'Unable to save.'); return body; });
      }).then(function (result) {
        statusEl.textContent = action === 'send'
          ? 'Recommendation v' + result.version + ' sent to the applicant.'
          : 'Draft saved.';
        statusEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = originalText;
      }).catch(function (err) {
        statusEl.textContent = err.message || 'Something went wrong — please try again.';
        statusEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = originalText;
      });
    }

    panel.querySelector('.scope-save-draft').addEventListener('click', function () { submitScope('draft', this); });
    panel.querySelector('.scope-approve-send').addEventListener('click', function () { submitScope('send', this); });
  }

  // Delivery & Completion panel — admin controls for the execution ledger
  // (program_purchase_sessions / program_purchase_document_reviews) and
  // the one-way service-completion action, per the Pre-Portal Master
  // Specification. Counts arrive already computed (COUNT(*) against the
  // ledger tables, see api/admin-applications.js) — this panel never
  // maintains its own counter, it only reflects and appends to the real
  // event history.
  function canLogDelivery(app) {
    return Boolean(app.purchase_id) && Boolean(TIER_DELIVERY_LIMITS[app.purchase_tier])
      && Boolean(app.entry_paid_at || app.initial_payment_paid_at);
  }

  function buildDeliveryToggleHtml(app) {
    return '<span class="delivery-toggle" data-app="' + app.id + '">Delivery &amp; Completion &darr;</span>' +
      '<div class="delivery-panel" id="delivery-panel-' + app.id + '"></div>';
  }

  function renderDeliveryPanelBody(panel, app, state) {
    var limits = TIER_DELIVERY_LIMITS[app.purchase_tier];
    var completedHtml = state.serviceCompletedAt
      ? '<p style="font-size:0.85rem; color:var(--gold-light); margin-top:14px;">Service completed ' +
          new Date(state.serviceCompletedAt).toLocaleDateString() +
          (state.continuityEndsAt ? ' &mdash; Continuity window ends ' + new Date(state.continuityEndsAt).toLocaleDateString() : '') +
        '</p>'
      : '<div style="margin-top:14px;"><button type="button" class="btn btn-outline btn-sm delivery-mark-complete-btn">Mark Service Complete</button>' +
        '<p style="font-size:0.72rem; color:var(--text-faint); margin-top:6px;">One-way — cannot be undone from this panel. Starts the client’s 30-day Continuity window.</p></div>';

    panel.innerHTML =
      '<p style="font-size:0.85rem;">Sessions delivered: <strong>' + state.sessionsUsed + ' / ' + limits.sessionCount + '</strong></p>' +
      (state.sessionsUsed < limits.sessionCount
        ? '<div class="delivery-log-row"><input type="number" class="delivery-session-num" min="1" max="' + limits.sessionCount + '" placeholder="#" value="' + (state.sessionsUsed + 1) + '">' +
          '<button type="button" class="btn btn-outline btn-sm delivery-log-session-btn">Log Session</button></div>'
        : '') +
      (limits.documentReviewEvents
        ? '<p style="font-size:0.85rem; margin-top:14px;">Document reviews used: <strong>' + state.reviewsUsed + ' / ' + limits.documentReviewEvents + '</strong></p>' +
          (state.reviewsUsed < limits.documentReviewEvents
            ? '<div class="delivery-log-row"><input type="number" class="delivery-review-num" min="1" max="' + limits.documentReviewEvents + '" placeholder="#" value="' + (state.reviewsUsed + 1) + '">' +
              '<button type="button" class="btn btn-outline btn-sm delivery-log-review-btn">Log Review</button></div>'
            : '')
        : '') +
      '<div class="delivery-status status-note" style="display:none; margin-top:10px;"></div>' +
      completedHtml;

    var statusEl = panel.querySelector('.delivery-status');
    function showError(err) {
      statusEl.textContent = (err && err.message) || 'Something went wrong.';
      statusEl.style.display = 'block';
    }

    var logSessionBtn = panel.querySelector('.delivery-log-session-btn');
    if (logSessionBtn) {
      logSessionBtn.addEventListener('click', function () {
        var num = Number(panel.querySelector('.delivery-session-num').value);
        if (!Number.isInteger(num) || num < 1) { showError({ message: 'Enter a valid session number.' }); return; }
        logSessionBtn.disabled = true;
        getAuthToken().then(function (token) {
          return fetch('/api/log-session-delivered', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token || '') },
            body: JSON.stringify({ purchaseId: app.purchase_id, sessionNumber: num }),
          });
        }).then(function (res) {
          return res.json().then(function (body) { if (!res.ok) throw new Error(body.error || 'Unable to log session.'); return body; });
        }).then(function (result) {
          renderDeliveryPanelBody(panel, app, Object.assign({}, state, { sessionsUsed: result.sessionsDelivered }));
        }).catch(function (err) {
          logSessionBtn.disabled = false;
          showError(err);
        });
      });
    }

    var logReviewBtn = panel.querySelector('.delivery-log-review-btn');
    if (logReviewBtn) {
      logReviewBtn.addEventListener('click', function () {
        var num = Number(panel.querySelector('.delivery-review-num').value);
        if (!Number.isInteger(num) || num < 1) { showError({ message: 'Enter a valid review number.' }); return; }
        logReviewBtn.disabled = true;
        getAuthToken().then(function (token) {
          return fetch('/api/log-document-review', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token || '') },
            body: JSON.stringify({ purchaseId: app.purchase_id, reviewNumber: num }),
          });
        }).then(function (res) {
          return res.json().then(function (body) { if (!res.ok) throw new Error(body.error || 'Unable to log review.'); return body; });
        }).then(function (result) {
          renderDeliveryPanelBody(panel, app, Object.assign({}, state, { reviewsUsed: result.documentReviewsUsed }));
        }).catch(function (err) {
          logReviewBtn.disabled = false;
          showError(err);
        });
      });
    }

    var completeBtn = panel.querySelector('.delivery-mark-complete-btn');
    if (completeBtn) {
      completeBtn.addEventListener('click', function () {
        if (!window.confirm('Mark this engagement’s service as complete? This cannot be undone from this panel and starts the client’s Continuity window.')) return;
        completeBtn.disabled = true;
        completeBtn.textContent = 'Marking complete…';
        getAuthToken().then(function (token) {
          return fetch('/api/mark-service-complete', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token || '') },
            body: JSON.stringify({ purchaseId: app.purchase_id }),
          });
        }).then(function (res) {
          return res.json().then(function (body) { if (!res.ok) throw new Error(body.error || 'Unable to mark complete.'); return body; });
        }).then(function (result) {
          renderDeliveryPanelBody(panel, app, Object.assign({}, state, {
            serviceCompletedAt: result.serviceCompletedAt, continuityEndsAt: result.continuityEndsAt,
          }));
        }).catch(function (err) {
          completeBtn.disabled = false;
          completeBtn.textContent = 'Mark Service Complete';
          showError(err);
        });
      });
    }
  }

  function wireDeliveryPanel(card, app) {
    var toggle = card.querySelector('.delivery-toggle');
    var panel = card.querySelector('.delivery-panel');
    var loaded = false;

    toggle.addEventListener('click', function () {
      if (panel.classList.contains('is-open')) { panel.classList.remove('is-open'); return; }
      panel.classList.add('is-open');
      if (loaded) return;
      loaded = true;
      renderDeliveryPanelBody(panel, app, {
        sessionsUsed: app.sessions_delivered || 0,
        reviewsUsed: app.document_reviews_used || 0,
        serviceCompletedAt: app.service_completed_at,
        continuityEndsAt: app.continuity_ends_at,
      });
    });
  }

  function renderApplication(app) {
    var card = document.createElement('div');
    card.className = 'glass card app-card';
    card.id = 'app-' + app.id;

    var decided = app.status === 'decided';
    var a = app.answers || {};

    var summaryHtml = '<dl class="app-summary">' + SUMMARY_FIELDS.map(function (f) {
      return '<div><dt>' + f[1] + '</dt><dd>' + esc(answerLabel(f[0], a[f[0]])) + '</dd></div>';
    }).join('') + '</dl>';

    var allAnswersHtml = '<dl>' + ALL_FIELDS.map(function (f) {
      return '<dt>' + f[1] + '</dt><dd>' + esc(answerLabel(f[0], a[f[0]])) + '</dd>';
    }).join('') + '</dl>';

    var scoreHtml;
    if (app.ai_error) {
      scoreHtml = '<span class="app-score low">AI scoring failed</span><p style="color:#e08a8a; font-size:0.85rem;">' + esc(app.ai_error) + '</p>';
    } else if (app.ai_score !== null && app.ai_score !== undefined) {
      scoreHtml = '<span class="app-score ' + scoreClass(app.ai_score) + '">Score: ' + app.ai_score + '</span>' +
        '<span class="app-score ' + scoreClass(app.ai_score) + '">' + esc(app.ai_recommendation || '') + '</span>' +
        (app.ai_rationale ? '<p style="margin-top:10px;"><strong>Rationale:</strong> ' + esc(app.ai_rationale) + '</p>' : '') +
        (app.ai_one_flag ? '<p><strong>Biggest risk:</strong> ' + esc(app.ai_one_flag) + '</p>' : '') +
        (app.ai_one_strength ? '<p><strong>Biggest asset:</strong> ' + esc(app.ai_one_strength) + '</p>' : '');
    } else {
      scoreHtml = '<span class="app-score mid">Scoring pending</span>';
    }

    var decisionHtml;
    if (decided) {
      var sentMsg = app.applicant_message ? '<p style="margin-top:8px; font-size:0.85rem; color:var(--text-faint);">Message sent: “' + esc(app.applicant_message) + '”</p>' : '';
      decisionHtml = '<div class="decision-row"><span class="decided-badge">Decided: ' + esc(app.decision) + ' on ' + new Date(app.decided_at).toLocaleDateString() + '</span></div>' + sentMsg;
      if (app.decision === 'ACCEPT' || app.decision === 'ACCEPT_WITH_CONDITIONS') {
        decisionHtml += buildScopeToggleHtml(app);
      }
      if (canLogDelivery(app)) {
        decisionHtml += buildDeliveryToggleHtml(app);
      }
    } else {
      decisionHtml =
        '<div class="decision-fields">' +
          '<div class="decision-field"><label>Internal CHEW Note <span class="field-hint">&mdash; only CHEW can see this.</span></label><textarea class="internal-note" rows="2"></textarea></div>' +
          '<div class="decision-field"><label>Message to Applicant <span class="field-hint">&mdash; this will be included in the decision email.</span></label><textarea class="applicant-message" rows="2"></textarea></div>' +
        '</div>' +
        '<div class="decision-row">' +
        DECISIONS.map(function (d) {
          return '<button type="button" class="btn btn-outline btn-sm decision-btn" data-decision="' + d.value + '" data-label="' + d.label + '">' + d.label + '</button>';
        }).join('') +
        '</div>' +
        '<div class="confirm-panel" id="confirm-' + app.id + '"></div>';
    }

    var pipelineStage = recommendationPipelineStage(app);
    card.setAttribute('data-pipeline', overallPipelineLabel(app) || '');

    card.innerHTML =
      '<div class="app-top-row">' + reviewBadge(app) + '<span class="app-badge app-badge--stage">' + journeyStage(app) + '</span>' +
      (pipelineStage ? '<span class="app-badge app-badge--pipeline">' + pipelineStage + '</span>' : '') +
      (app.is_graduate ? '<span class="app-badge app-badge--graduate">Membership Eligible</span>' : '') +
      (app.portal_invited_at ? '<span class="app-badge app-badge--portal">Portal Invited ' + new Date(app.portal_invited_at).toLocaleDateString() + '</span>' : '') +
      '</div>' +
      '<div class="app-meta">#' + app.id + ' &middot; Submitted ' + new Date(app.created_at).toLocaleString() + '</div>' +
      '<h3 style="margin-bottom:4px;">' + esc(app.full_name) + '</h3>' +
      '<div class="app-meta">' + esc(app.email) + (app.phone ? ' &middot; ' + esc(app.phone) : '') + '</div>' +
      summaryHtml +
      '<span class="app-section-toggle" data-toggle="answers">Show all 11 answers &darr;</span>' +
      '<div class="app-answers-block" data-block="answers">' + allAnswersHtml + '</div>' +
      '<br>' +
      '<span class="app-section-toggle" data-toggle="analysis">Internal CHEW analysis &darr;</span>' +
      '<div class="app-analysis-block" data-block="analysis">' +
        '<span class="app-analysis-caveat">Internal decision support only &mdash; not verified fact, never shown to applicants</span>' +
        scoreHtml +
      '</div>' +
      decisionHtml;

    card.querySelectorAll('[data-toggle]').forEach(function (toggle) {
      toggle.addEventListener('click', function () {
        var block = card.querySelector('[data-block="' + toggle.getAttribute('data-toggle') + '"]');
        var open = block.style.display === 'block';
        block.style.display = open ? 'none' : 'block';
      });
    });

    if (!decided) {
      var confirmPanel = card.querySelector('.confirm-panel');
      card.querySelectorAll('.decision-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var decisionValue = btn.getAttribute('data-decision');
          var decisionLabel = btn.getAttribute('data-label');
          var internalNote = card.querySelector('.internal-note').value;
          var applicantMessage = card.querySelector('.applicant-message').value;

          // Deliberately no reference to internalNote anywhere below this
          // line — this preview is what the applicant's email will
          // effectively say, and the internal note must never appear in
          // it, even as a passing mention.
          confirmPanel.innerHTML =
            '<p><strong>Applicant:</strong> ' + esc(app.full_name) + ' (' + esc(app.email) + ')<br>' +
            '<strong>Decision:</strong> ' + esc(decisionLabel) + '<br>' +
            '<strong>Message they will receive:</strong><br>' +
            (applicantMessage
              ? '<em>' + esc(applicantMessage) + '</em>'
              : '<span style="color:var(--text-faint);">(no additional message &mdash; standard ' + esc(decisionLabel) + ' email only)</span>') +
            '</p>' +
            '<div class="confirm-actions">' +
              '<button type="button" class="btn btn-gold btn-sm confirm-send">Confirm &amp; Send</button>' +
              '<button type="button" class="btn btn-outline btn-sm confirm-cancel">Cancel</button>' +
            '</div>';
          confirmPanel.classList.add('is-visible');
          confirmPanel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

          confirmPanel.querySelector('.confirm-cancel').addEventListener('click', function () {
            confirmPanel.classList.remove('is-visible');
            confirmPanel.innerHTML = '';
          });
          confirmPanel.querySelector('.confirm-send').addEventListener('click', function () {
            sendDecision(app.id, decisionValue, internalNote, applicantMessage, card, confirmPanel);
          });
        });
      });
    }

    if (decided && (app.decision === 'ACCEPT' || app.decision === 'ACCEPT_WITH_CONDITIONS')) {
      wireScopeBuilder(card, app);
    }
    if (decided && canLogDelivery(app)) {
      wireDeliveryPanel(card, app);
    }

    return card;
  }

  function sendDecision(id, decision, internalNote, applicantMessage, card, confirmPanel) {
    var buttons = card.querySelectorAll('.decision-btn');
    buttons.forEach(function (b) { b.disabled = true; });
    confirmPanel.innerHTML = '<p>Sending&hellip;</p>';

    getAuthToken()
      .then(function (token) {
        return fetch('/api/send-decision', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + (token || '') },
          body: JSON.stringify({ id: id, decision: decision, internalNote: internalNote, applicantMessage: applicantMessage }),
        });
      })
      .then(function (res) {
        if (!res.ok) throw new Error('Failed to send decision');
        return res.json();
      })
      .then(function () {
        loadQueue();
      })
      .catch(function () {
        statusEl.textContent = 'Failed to send decision for application #' + id + '. Please try again.';
        statusEl.classList.add('visible');
        buttons.forEach(function (b) { b.disabled = false; });
        confirmPanel.classList.remove('is-visible');
        confirmPanel.innerHTML = '';
      });
  }

  function highlightFromHash() {
    if (!(window.location.hash && window.location.hash.indexOf('#app-') === 0)) return;
    document.querySelectorAll('.app-card.is-highlighted').forEach(function (el) { el.classList.remove('is-highlighted'); });
    var target = document.querySelector(window.location.hash);
    if (target) {
      target.classList.add('is-highlighted');
      window.setTimeout(function () { target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 80);
    }
  }

  // Covers the same-tab case: the operator already has this page open
  // (queue already loaded, already signed in) and a link change only
  // updates the #app-N fragment without a full navigation —
  // browsers don't re-run page-load script for a same-document hash
  // change, so this listens for it explicitly rather than requiring a
  // full reload to see the right application highlighted.
  window.addEventListener('hashchange', function () {
    if (listEl.children.length > 0) highlightFromHash();
  });

  function applyPipelineFilter(label) {
    activePipelineFilter = label;
    filterEl.querySelectorAll('.pipeline-filter-chip').forEach(function (chip) {
      chip.classList.toggle('is-active', chip.getAttribute('data-filter') === label);
    });
    listEl.querySelectorAll('.app-card').forEach(function (card) {
      var matches = label === 'ALL' || card.getAttribute('data-pipeline') === label;
      card.style.display = matches ? '' : 'none';
    });
  }

  function renderPipelineFilters() {
    filterEl.innerHTML = PIPELINE_FILTERS.map(function (label) {
      return '<button type="button" class="pipeline-filter-chip' + (label === activePipelineFilter ? ' is-active' : '') + '" data-filter="' + label + '">' + label + '</button>';
    }).join('');
    filterEl.querySelectorAll('.pipeline-filter-chip').forEach(function (chip) {
      chip.addEventListener('click', function () { applyPipelineFilter(chip.getAttribute('data-filter')); });
    });
    applyPipelineFilter(activePipelineFilter);
  }

  function loadQueue() {
    accessForm.style.display = 'none';
    statusEl.textContent = 'Loading...';
    statusEl.classList.add('visible');
    statusEl.style.display = 'block';
    listEl.innerHTML = '';

    return getAuthToken()
      .then(function (token) {
        if (!token) {
          var noToken = new Error('Your sign-in session isn’t available. Please sign in again.');
          noToken.isAuthFailure = true;
          throw noToken;
        }
        return fetch('/api/admin-applications', { headers: { authorization: 'Bearer ' + token } });
      })
      .then(function (res) {
        if (res.status === 401 || res.status === 403) {
          var err = new Error('Your sign-in session isn’t authorized for the admissions queue.');
          err.isAuthFailure = true;
          throw err;
        }
        if (!res.ok) throw new Error('Failed to load applications.');
        return res.json();
      })
      .then(function (data) {
        statusEl.style.display = 'none';
        if (!data.applications || data.applications.length === 0) {
          listEl.innerHTML = '<p style="color:var(--text-faint);">No applications yet.</p>';
          filterEl.innerHTML = '';
          return;
        }
        data.applications.forEach(function (app) {
          listEl.appendChild(renderApplication(app));
        });

        renderPipelineFilters();
        highlightFromHash();
      })
      .catch(function (err) {
        if (err.isAuthFailure) {
          if (window.Clerk && window.Clerk.signOut) window.Clerk.signOut();
          showAccessForm(err.message);
          return;
        }
        statusEl.textContent = err.message;
        statusEl.classList.add('visible');
      });
  }
})();
</script>
</body>
</html>

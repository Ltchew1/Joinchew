<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEW Orbit — Prototype (Internal Review)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ============================================================
   CHEW ORBIT — isolated prototype, not linked from the live site.
   Proves a new composition language (spatial/interactive/cinematic)
   before it replaces the real hero. Everything here is scoped under
   .orbit-proto so it cannot leak into any other page. Reuses the
   site's real color/font tokens (styles.css :root) so it reads as
   CHEW, not a foreign system.
   ============================================================ */
.orbit-proto {
  position: relative;
  min-height: 100vh; min-height: 100svh;
  overflow: hidden;
  background: #060605;
  isolation: isolate;
}

/* ---- Depth layer 1: background — architecture grid + haze, barely moves ---- */
.orbit-bg { position: absolute; inset: -5%; z-index: 0; pointer-events: none; }
.orbit-bg::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,206,122,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,206,122,0.05) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 75% 70% at 62% 50%, black 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 75% 70% at 62% 50%, black 20%, transparent 75%);
}
.orbit-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 55% at 62% 50%, rgba(201,162,39,0.10), transparent 65%),
    radial-gradient(ellipse 40% 40% at 12% 90%, rgba(123,156,190,0.05), transparent 60%),
    radial-gradient(ellipse 50% 45% at 90% 5%, rgba(232,206,122,0.06), transparent 60%);
}
.orbit-vignette {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: radial-gradient(ellipse 90% 85% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
}

/* ---- Top bar: brand + internal-review tag, not the real site nav ---- */
.orbit-topbar {
  position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: 22px 28px; flex-wrap: wrap; gap: 10px;
}
.orbit-brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--text); }
.orbit-brand img { border-radius: 6px; }
.orbit-topbar .tag { font-size: 0.66rem; }

/* ---- Copy HUD: exactly one greeting label, one headline, one supporting
   line, one live status readout, the Next Move object, one CTA. Everything
   else in the scene is visual. ---- */
.orbit-copy {
  position: absolute; z-index: 5; left: 28px; top: 92px; max-width: 400px;
}
.orbit-greeting { display: block; font-size: 0.72rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold-light); opacity: 0.85; margin-bottom: 14px; }
.orbit-headline {
  font-family: var(--font-body); font-weight: 600; font-size: clamp(1.7rem, 2.7vw, 2.35rem);
  line-height: 1.14; letter-spacing: -0.01em; color: var(--text); margin: 0 0 12px;
}
.orbit-sub { font-size: 0.94rem; color: var(--text-muted); margin: 0 0 20px; max-width: 32ch; }
.orbit-status {
  display: inline-flex; align-items: center; gap: 8px; font-size: 0.72rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--gold-light); font-family: var(--font-body); font-weight: 600;
  padding: 7px 12px 7px 10px; border: 1px solid rgba(201,162,39,0.3); border-radius: 999px;
  background: rgba(201,162,39,0.06); margin-bottom: 18px;
}
.orbit-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold-light); animation: orbit-status-blink 1.4s ease-in-out infinite; flex-shrink: 0; }
@keyframes orbit-status-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.orbit-proto.is-settled .orbit-status-dot { animation: none; opacity: 0.9; }

.orbit-next-move {
  border: 1px solid rgba(201,162,39,0.4); border-radius: 10px; padding: 14px 16px;
  background: linear-gradient(155deg, rgba(232,206,122,0.08), rgba(0,0,0,0.25));
  margin-bottom: 20px; max-width: 320px;
  opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(3px);
  transition: opacity 0.6s cubic-bezier(.16,1,.3,1), transform 0.6s cubic-bezier(.16,1,.3,1), filter 0.6s ease;
}
.orbit-next-move.is-shown { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
.orbit-next-move-label { display: block; font-size: 0.64rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 6px; }
.orbit-next-move-text { margin: 0; font-size: 0.9rem; color: var(--text); line-height: 1.4; }

.orbit-cta { position: relative; z-index: 1; }

/* ---- The field itself: full-bleed, not a boxed widget ---- */
.orbit-field { position: absolute; inset: 0; z-index: 2; }
.orbit-rings, .orbit-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.orbit-ring { fill: none; stroke: rgba(232,206,122,0.10); stroke-width: 1; stroke-dasharray: 2 6; vector-effect: non-scaling-stroke; }
.orbit-ring--outer { stroke: rgba(232,206,122,0.06); }

.orbit-line {
  fill: none; stroke: rgba(232,206,122,0.28); stroke-width: 1.4; stroke-linecap: round;
  stroke-dasharray: 620; stroke-dashoffset: 620; vector-effect: non-scaling-stroke;
  transition: stroke-dashoffset 1s cubic-bezier(.16,1,.3,1), stroke 0.6s ease, opacity 0.6s ease;
}
.orbit-proto.is-lines .orbit-line { stroke-dashoffset: 0; }
.orbit-line--barrier { stroke: rgba(232,206,122,0.28); }
.orbit-proto.is-barrier .orbit-line--barrier {
  stroke: #C97A4A; stroke-dasharray: 10 9; stroke-dashoffset: 0;
  animation: orbit-line-fault 2.2s steps(2) infinite;
}
.orbit-proto.is-resolved .orbit-line--barrier {
  stroke: var(--gold-light); stroke-dasharray: 620; stroke-dashoffset: 0; animation: none;
  filter: drop-shadow(0 0 4px rgba(232,206,122,0.5));
}
@keyframes orbit-line-fault { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

.orbit-line--preview {
  stroke: rgba(232,206,122,0.5); stroke-dasharray: 4 8; opacity: 0; vector-effect: non-scaling-stroke;
  transition: opacity 0.8s ease, stroke-dashoffset 1.4s ease;
}
.orbit-proto.is-previewing .orbit-line--preview { opacity: 1; stroke-dashoffset: 0; }
.orbit-proto.is-opportunity .orbit-line--preview { stroke: var(--gold-light); stroke-dasharray: none; opacity: 1; filter: drop-shadow(0 0 5px rgba(232,206,122,0.55)); }

.orbit-pulse-ring { fill: none; stroke: var(--gold-light); stroke-width: 1.6; opacity: 0; transform-origin: center; transform-box: fill-box; vector-effect: non-scaling-stroke; }
.orbit-proto.is-evaluating .orbit-pulse-ring { animation: orbit-pulse-expand 1.1s cubic-bezier(.16,1,.3,1) 1; }
@keyframes orbit-pulse-expand {
  0% { opacity: 0.9; transform: scale(0.3); }
  70% { opacity: 0.35; }
  100% { opacity: 0; transform: scale(1.15); }
}

/* ---- Nodes: positioned via custom properties so mobile can redefine
   the whole layout without touching markup. ---- */
.orbit-node {
  position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%) scale(var(--depth-scale, 1));
  filter: blur(var(--depth-blur, 0px)); opacity: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center; width: 108px;
  transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.6s cubic-bezier(.16,1,.3,1), filter 0.5s ease;
  background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-body);
}
.orbit-proto.is-nodes .orbit-node { opacity: var(--depth-opacity, 1); }
.orbit-node:nth-of-type(1) { transition-delay: 0.02s; }
.orbit-node:nth-of-type(2) { transition-delay: 0.08s; }
.orbit-node:nth-of-type(3) { transition-delay: 0.14s; }
.orbit-node:nth-of-type(4) { transition-delay: 0.20s; }
.orbit-node:nth-of-type(5) { transition-delay: 0.26s; }
.orbit-node:nth-of-type(6) { transition-delay: 0.32s; }
.orbit-node:nth-of-type(7) { transition-delay: 0.38s; }
.orbit-node:nth-of-type(8) { transition-delay: 0.44s; }

.orbit-node-mark {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid rgba(232,206,122,0.35);
  background: linear-gradient(155deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s cubic-bezier(.16,1,.3,1);
}
.orbit-node-mark svg { width: 18px; height: 18px; }
.orbit-node:hover .orbit-node-mark, .orbit-node:focus-visible .orbit-node-mark { border-color: var(--gold-light); transform: scale(1.08); box-shadow: 0 0 18px rgba(201,162,39,0.25); }
.orbit-node-name { font-size: 0.76rem; font-weight: 600; color: var(--text); letter-spacing: 0.01em; }
.orbit-node-tag {
  font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint);
}

/* Goal marker: diamond destination form, not a circle */
.orbit-node--goal .orbit-node-mark { border-radius: 8px; transform: rotate(45deg); }
.orbit-node--goal .orbit-node-mark svg { transform: rotate(-45deg); }

/* Barrier: broken ring, warm interrupt color */
.orbit-node--barrier .orbit-node-mark { border-style: dashed; }
.orbit-proto.is-barrier .orbit-node--barrier .orbit-node-mark { border-color: #C97A4A; box-shadow: 0 0 16px rgba(201,122,74,0.25); }
.orbit-proto.is-barrier .orbit-node--barrier .orbit-node-tag { color: #D89468; }
.orbit-proto.is-resolved .orbit-node--barrier .orbit-node-mark { border-style: solid; border-color: var(--gold-light); box-shadow: 0 0 18px rgba(201,162,39,0.3); }
.orbit-proto.is-resolved .orbit-node--barrier .orbit-node-tag { color: var(--gold-light); }

/* Opportunity: portal double-ring, brightens late in the sequence */
.orbit-node--opportunity .orbit-node-mark { position: relative; }
.orbit-node--opportunity .orbit-node-mark::after {
  content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 1px solid rgba(232,206,122,0.18);
  opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease; transform: scale(0.85);
}
.orbit-proto.is-opportunity .orbit-node--opportunity .orbit-node-mark { border-color: var(--gold-light); box-shadow: 0 0 22px rgba(232,206,122,0.4); }
.orbit-proto.is-opportunity .orbit-node--opportunity .orbit-node-mark::after { opacity: 1; transform: scale(1); }
.orbit-proto.is-opportunity .orbit-node--opportunity .orbit-node-tag { color: var(--gold-light); }

/* Member core */
.orbit-node--center {
  width: auto; cursor: default; opacity: 1 !important; transform: translate(-50%, -50%) scale(0.4);
  transition: transform 0.7s cubic-bezier(.16,1,.3,1);
}
.orbit-proto.is-center .orbit-node--center { transform: translate(-50%, -50%) scale(1); }
.orbit-node--center .orbit-node-core {
  width: 74px; height: 74px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #F4E7BC, var(--gold) 55%, var(--gold-deep) 100%);
  box-shadow: 0 0 0 1px rgba(232,206,122,0.3), 0 0 40px rgba(201,162,39,0.35);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 0.82rem; color: #14120A; letter-spacing: 0.02em;
}
.orbit-proto.is-settled .orbit-node--center .orbit-node-core { animation: orbit-breathe 4.4s ease-in-out infinite; }
@keyframes orbit-breathe { 0%,100% { box-shadow: 0 0 0 1px rgba(232,206,122,0.3), 0 0 40px rgba(201,162,39,0.35); } 50% { box-shadow: 0 0 0 1px rgba(232,206,122,0.4), 0 0 58px rgba(201,162,39,0.5); } }

/* ---- Next Move ghost line: a short accent under the CTA, standing in
   for the "command object" motif without a second on-field element. ---- */
.orbit-node-detail {
  position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  width: max-content; max-width: 180px; font-size: 0.68rem; color: var(--text-faint);
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease; background: rgba(6,6,5,0.92);
  border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px 9px; line-height: 1.35;
}
.orbit-node:hover .orbit-node-detail, .orbit-node:focus-visible .orbit-node-detail { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .orbit-proto * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

@media (max-width: 760px) {
  .orbit-proto { min-height: 100svh; }
  .orbit-topbar { padding: 16px 18px; }
  .orbit-topbar .tag { display: none; }
  .orbit-copy {
    left: 18px; right: 18px; top: 74px; max-width: none;
    padding-bottom: 18px;
  }
  .orbit-copy::before {
    content: '';
    position: absolute; left: -18px; right: -18px; top: -74px; bottom: -24px; z-index: -1;
    background: linear-gradient(180deg, rgba(6,6,5,0.94) 0%, rgba(6,6,5,0.94) 62%, rgba(6,6,5,0) 100%);
  }
  .orbit-greeting { margin-bottom: 8px; }
  .orbit-headline { font-size: 1.4rem; margin-bottom: 8px; }
  .orbit-sub { font-size: 0.86rem; margin-bottom: 12px; }
  .orbit-status { margin-bottom: 12px; }
  .orbit-next-move { padding: 11px 13px; margin-bottom: 14px; }
  .orbit-next-move-text { font-size: 0.84rem; }

  .orbit-node { width: 68px; }
  .orbit-node-mark { width: 36px; height: 36px; }
  .orbit-node-mark svg { width: 14px; height: 14px; }
  .orbit-node-name { font-size: 0.68rem; }
  .orbit-node-tag { display: none; }
  .orbit-node-detail { display: none; }
  .orbit-node--center .orbit-node-core { width: 54px; height: 54px; font-size: 0.64rem; }

  [data-node="income"]      { --x: 50%; --y: 60%; }
  [data-node="goals"]       { --x: 82%; --y: 66%; }
  [data-node="business"]    { --x: 89%; --y: 82%; }
  [data-node="credit"]      { --x: 78%; --y: 96%; }
  [data-node="career"]      { --x: 50%; --y: 100%; }
  [data-node="home"]        { --x: 22%; --y: 96%; }
  [data-node="savings"]     { --x: 11%; --y: 82%; }
  [data-node="vehicle"]     { --x: 18%; --y: 66%; }
  [data-node="center"]      { --x: 50%; --y: 82%; }
  .orbit-rings, .orbit-lines { transform-origin: 50% 82%; }
}
</style>
</head>
<body style="overflow-x:hidden;">

<div class="orbit-proto" id="orbitProto">
  <div class="orbit-bg" aria-hidden="true" data-depth-layer="bg"></div>
  <div class="orbit-vignette" aria-hidden="true"></div>

  <header class="orbit-topbar">
    <a href="index.html" class="orbit-brand"><img src="assets/chew-icon-official.png" alt="" width="28" height="28">CHEW</a>
    <span class="tag tag--sample">Internal prototype &mdash; illustrative example, not your real accounts</span>
  </header>

  <div class="orbit-copy">
    <span class="orbit-greeting">Good evening</span>
    <h1 class="orbit-headline">Let&rsquo;s see what moves next.</h1>
    <p class="orbit-sub">CHEW is reading your whole position &mdash; live.</p>
    <div class="orbit-status" role="status" aria-live="polite">
      <span class="orbit-status-dot" aria-hidden="true"></span>
      <span id="orbitStatusText">Initializing</span>
    </div>
    <div class="orbit-next-move" id="orbitNextMove">
      <span class="orbit-next-move-label">Next Move</span>
      <p class="orbit-next-move-text">Resolve the reporting gap on your credit file &mdash; it&rsquo;s the one thing standing between you and Home.</p>
    </div>
    <a href="apply.html" class="btn btn-gold cta-glow btn-magnetic orbit-cta">I&rsquo;m Ready to Chew</a>
  </div>

  <div class="orbit-field" id="orbitField" data-depth-layer="field">
    <svg class="orbit-rings" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <ellipse class="orbit-ring" cx="62" cy="56" rx="30" ry="26"/>
      <ellipse class="orbit-ring" cx="62" cy="56" rx="20" ry="17"/>
      <ellipse class="orbit-ring orbit-ring--outer" cx="62" cy="56" rx="38" ry="33"/>
    </svg>

    <svg class="orbit-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="orbit-line" data-line="income"   d="M62,56 L62,16" pathLength="620"/>
      <path class="orbit-line" data-line="goals"     d="M62,56 L88,26" pathLength="620"/>
      <path class="orbit-line" data-line="business"  d="M62,56 L93,56" pathLength="620"/>
      <path class="orbit-line orbit-line--barrier" data-line="credit" d="M62,56 L86,84" pathLength="620"/>
      <path class="orbit-line" data-line="career"    d="M62,56 L62,92" pathLength="620"/>
      <path class="orbit-line" data-line="home"      d="M62,56 L38,84" pathLength="620"/>
      <path class="orbit-line" data-line="savings"   d="M62,56 L31,56" pathLength="620"/>
      <path class="orbit-line" data-line="vehicle"   d="M62,56 L36,26" pathLength="620"/>
      <path class="orbit-line orbit-line--preview" d="M62,56 L38,84" pathLength="620"/>
      <circle class="orbit-pulse-ring" cx="62" cy="56" r="8"/>
    </svg>

    <button type="button" class="orbit-node orbit-node--center" data-node="center" style="--x:62%;--y:56%;" tabindex="-1">
      <span class="orbit-node-core">YOU</span>
    </button>

    <button type="button" class="orbit-node orbit-node--depth-close" data-node="income" style="--x:62%;--y:16%; --depth-scale:1.06; --depth-opacity:1;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18l6-7 4 4 6-9" stroke="var(--gold-light)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="orbit-node-name">Income</span>
      <span class="orbit-node-tag">Active</span>
      <span class="orbit-node-detail">Steady inflow, tracked monthly.</span>
    </button>

    <button type="button" class="orbit-node orbit-node--goal" data-node="goals" style="--x:88%;--y:26%; --depth-scale:0.8; --depth-blur:0.5px; --depth-opacity:0.78;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4l3 5-3 5-3-5 3-5z" stroke="var(--gold-light)" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span class="orbit-node-name">Goals</span>
      <span class="orbit-node-tag">1 active</span>
      <span class="orbit-node-detail">Buy a home &mdash; the destination this whole field is tracing toward.</span>
    </button>

    <button type="button" class="orbit-node" data-node="business" style="--x:93%;--y:56%; --depth-scale:0.95; --depth-opacity:0.9;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="9" width="14" height="11" rx="1.5" stroke="var(--gold-light)" stroke-width="1.6"/><path d="M9 9V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V9" stroke="var(--gold-light)" stroke-width="1.6"/></svg></span>
      <span class="orbit-node-name">Business</span>
      <span class="orbit-node-tag">Active</span>
      <span class="orbit-node-detail">Structured, separate from personal finances.</span>
    </button>

    <button type="button" class="orbit-node orbit-node--barrier" data-node="credit" style="--x:86%;--y:84%; --depth-scale:1;--depth-opacity:1;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h5l2-5 3 10 2-5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="orbit-node-name">Credit</span>
      <span class="orbit-node-tag" id="creditTag">Reading</span>
      <span class="orbit-node-detail" id="creditDetail">Scanning your file for what's actually blocking you.</span>
    </button>

    <button type="button" class="orbit-node" data-node="career" style="--x:62%;--y:92%; --depth-scale:0.92; --depth-opacity:0.88;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="var(--gold-light)" stroke-width="1.6"/><path d="M5 19c1.2-3.4 4-5 7-5s5.8 1.6 7 5" stroke="var(--gold-light)" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="orbit-node-name">Career</span>
      <span class="orbit-node-tag">Active</span>
      <span class="orbit-node-detail">Income source, tracked for stability.</span>
    </button>

    <button type="button" class="orbit-node orbit-node--opportunity" data-node="home" style="--x:38%;--y:84%; --depth-scale:1; --depth-opacity:0.95;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6" stroke="var(--gold-light)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="var(--gold-light)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="orbit-node-name">Home</span>
      <span class="orbit-node-tag" id="homeTag">Dormant</span>
      <span class="orbit-node-detail" id="homeDetail">Opens once the credit gap clears.</span>
    </button>

    <button type="button" class="orbit-node" data-node="savings" style="--x:31%;--y:56%; --depth-scale:1.05; --depth-opacity:1;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 15c0-5 4-9 9-9M13 6l3-1v3" stroke="var(--gold-light)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="15" r="1" fill="var(--gold-light)"/></svg></span>
      <span class="orbit-node-name">Savings</span>
      <span class="orbit-node-tag">Active</span>
      <span class="orbit-node-detail">Building toward the down payment.</span>
    </button>

    <button type="button" class="orbit-node" data-node="vehicle" style="--x:36%;--y:26%; --depth-scale:0.8; --depth-blur:0.5px; --depth-opacity:0.75;">
      <span class="orbit-node-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 16l1.5-5.5A2 2 0 0 1 7.4 9h9.2a2 2 0 0 1 1.9 1.5L20 16" stroke="var(--gold-light)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="17" r="1.4" stroke="var(--gold-light)" stroke-width="1.4"/><circle cx="16.5" cy="17" r="1.4" stroke="var(--gold-light)" stroke-width="1.4"/></svg></span>
      <span class="orbit-node-name">Vehicle</span>
      <span class="orbit-node-tag">Dormant</span>
      <span class="orbit-node-detail">Not part of this goal path yet.</span>
    </button>
  </div>
</div>

<script>
(function () {
  var proto = document.getElementById('orbitProto');
  var statusText = document.getElementById('orbitStatusText');
  var nextMove = document.getElementById('orbitNextMove');
  var creditTag = document.getElementById('creditTag');
  var creditDetail = document.getElementById('creditDetail');
  var homeTag = document.getElementById('homeTag');
  var homeDetail = document.getElementById('homeDetail');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var STAGES = [
    { at: 0,    fn: function () { proto.classList.add('is-center'); setStatus('Initializing'); } },
    { at: 400,  fn: function () { proto.classList.add('is-nodes', 'is-lines'); setStatus('Signal detected'); } },
    { at: 1500, fn: function () { setStatus('Reading your position'); } },
    { at: 1900, fn: function () { proto.classList.add('is-barrier'); creditTag.textContent = 'Blocked'; creditDetail.textContent = 'Reporting gap is holding your score back.'; setStatus('Barrier found — credit'); } },
    { at: 2500, fn: function () { proto.classList.add('is-evaluating'); setStatus('Evaluating your position'); } },
    { at: 3000, fn: function () { proto.classList.add('is-previewing'); setStatus('Tracing what this unlocks'); } },
    { at: 3500, fn: function () { proto.classList.remove('is-barrier'); proto.classList.add('is-resolved'); creditTag.textContent = 'Move ready'; creditDetail.textContent = 'A specific move addresses this — see it on the left.'; nextMove.classList.add('is-shown'); setStatus('Next move locked in'); } },
    { at: 4000, fn: function () { proto.classList.add('is-opportunity'); homeTag.textContent = 'Opens next'; homeDetail.textContent = 'Reachable once the credit move is done.'; setStatus('Home — opening'); } },
    { at: 4600, fn: function () { proto.classList.add('is-settled'); setStatus('Live position — 1 move ready'); } }
  ];

  function setStatus(text) { statusText.textContent = text; }

  if (reduceMotion) {
    STAGES.forEach(function (s) { s.fn(); });
  } else {
    STAGES.forEach(function (s) { setTimeout(s.fn, s.at); });
  }

  // Gentle parallax between depth layers on desktop hover-capable pointers only.
  if (!reduceMotion && window.matchMedia && !window.matchMedia('(hover: none)').matches) {
    var field = document.getElementById('orbitField');
    var bg = document.querySelector('.orbit-bg');
    proto.addEventListener('mousemove', function (e) {
      var cx = (e.clientX / window.innerWidth - 0.5);
      var cy = (e.clientY / window.innerHeight - 0.5);
      field.style.transform = 'translate(' + (cx * -8).toFixed(1) + 'px,' + (cy * -6).toFixed(1) + 'px)';
      bg.style.transform = 'translate(' + (cx * -3).toFixed(1) + 'px,' + (cy * -2).toFixed(1) + 'px)';
    });
    proto.addEventListener('mouseleave', function () {
      field.style.transform = ''; bg.style.transform = '';
    });
  }
})();
</script>
</body>
</html>
